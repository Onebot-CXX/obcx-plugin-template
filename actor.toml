schema_version = 1

[actor]
id = "onebot-cxx.example"
name = "example"
version = "0.1.0"
abi = 2

[artifact]
name = "example"
target = "example_actor"
kind = "shared-library"
entrypoint = "obcx_create_actor_v2"
platforms = ["linux-x86_64"]

[dependencies]
packages = []
actors = []

[compatibility]
obcx = ">=1.1.0,<2.0.0"
actor_abi_min = 2
actor_abi_max = 2

[publication]
repository = "https://github.com/Onebot-CXX/obcx-actor-template"
homepage = "https://github.com/Onebot-CXX/obcx-actor-template"
license = "MIT"
description = "Template native V2 actor package for OBCX"
